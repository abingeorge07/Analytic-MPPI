[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytic-mppi"
version = "0.1.0"
description = "PMR: MuJoCo-in-loop MPPI testbed"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "mujoco>=3.2",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["imageio[ffmpeg]>=2.30"]

[tool.hatch.build.targets.wheel]
packages = ["analytic_mppi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
