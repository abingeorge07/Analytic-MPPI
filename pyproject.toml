[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytic-mppi"
version = "0.1.0"
description = "PMR: MuJoCo-in-loop MPPI testbed"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "mujoco>=3.2",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["imageio[ffmpeg]>=2.30"]
# Gymnasium LunarLander env (Box2D); pygame only needed for `--live` rendering.
# box2d-py builds from source, so a `swig` is required (e.g. `pip install swig`).
lunarlander = ["gymnasium>=0.29", "box2d-py>=2.3.5", "pygame>=2.5"]

[tool.hatch.build.targets.wheel]
packages = ["analytic_mppi"]

# Include MJCF and other data files shipped under analytic_mppi/envs/<env>/
[tool.hatch.build.targets.wheel.force-include]
"analytic_mppi/envs" = "analytic_mppi/envs"

[tool.pytest.ini_options]
testpaths = ["tests"]
